<div id="comments">
    {{- $cid := printf "%v" .Params.cid -}}
    {{- with index hugo.Data.legacy_comments $cid }}
	<p>
	   已有 {{ .count }} 条评论
	   <a class="pull-right" href="#response"><i class="fa fa-pencil"></i> 添加新评论</a>
	</p>
    {{ .html | safeHTML }}
    {{- end }}

    <div id="respond-post-{{ .Params.cid }}" class="respond">
        <h3 id="response">添加新评论</h3>
        {{- $t := site.Params.twikoo }}
        {{- if $t.envId }}
        <div id="twikoo"></div>
        <script src="/vendor/twikoo/twikoo.min.js"></script>
        <script>
          twikoo.init({
            envId: "{{ $t.envId }}",
            el: '#twikoo',
            path: location.pathname,
            lang: 'zh-CN'
          });
        </script>
        <noscript>评论功能需要启用 JavaScript。</noscript>
        {{- else }}
        <p class="comment-note">评论功能正在配置中。</p>
        {{- end }}
    </div>
</div>
